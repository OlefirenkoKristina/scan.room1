<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогулянка по кімнаті</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #111; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,15,0.75);
    color: #fff; font-family: system-ui, sans-serif;
    text-align: center; z-index: 10; cursor: pointer;
  }
  #overlay .box { max-width: 420px; padding: 24px; }
  #overlay h1 { font-size: 22px; margin: 0 0 12px; }
  #overlay p { font-size: 14px; line-height: 1.6; opacity: 0.85; margin: 6px 0; }
  #overlay .hint { margin-top: 16px; font-size: 13px; opacity: 0.6; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    color: #fff; font-family: system-ui, sans-serif; font-size: 12px;
    background: rgba(0,0,0,0.35); padding: 6px 10px; border-radius: 6px;
    pointer-events: none; display: none;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,0.8); z-index: 5; display: none;
    pointer-events: none;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: system-ui, sans-serif; font-size: 14px; z-index: 20; background: #111;
  }
</style>
</head>
<body>

<div id="loading">Завантаження кімнати…</div>

<div id="overlay" style="display:none;">
  <div class="box">
    <h1>Прогулянка по кімнаті</h1>
    <p>WASD / стрілки — рух, мишка — огляд, Shift — біг, пробіл — трохи піднятись (noclip вгору).</p>
    <p>Натисніть, щоб почати</p>
    <div class="hint">Esc — вийти з режиму огляду</div>
  </div>
</div>

<div id="hud">WASD — рух · Shift — біг · Esc — вихід</div>
<div id="crosshair"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="main.js"></script>
</body>
</html>
